.trio.t2{margin-top:0}

.cal{grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-template-columns:repeat(12,1fr)!important;justify-items:center}

</style></head><body>

<script>

// ---------- Plan (source: Gym Log Phase 2 / coach targets, 5 Oct) ----------
const ORDER0 = ["Upper A","Lower A","Upper B","Lower B"];
// The rotation is user-editable (rename, add, remove) and lives in DB.order; this mirrors it
let ORDER = ORDER0.slice();
// Phase 1 full-body sessions imported from Hevy. Shown in Log and Stats, never in the rotation.
const HIST = ["Phase 1 A","Phase 1 B"];
const COLORS = {"Upper A":"--ua","Lower A":"--la","Upper B":"--ub","Lower B":"--lb"};
const SUBT = {"Upper A":"Chest · Back · Arms","Lower A":"Legs · Core","Upper B":"Upper body #2","Lower B":"Legs #2"};
// unit: kg | BW (bodyweight) | sec (seconds) | min (cardio, logged in minutes). lb:true = less kg is stronger (assist machines)
const PLAN = {
 "Upper A":[
  {n:"Bike warmup",s:"5 min",t:5,u:"min",tip:"Easy spin"},
  {n:"Chest Press",s:"3 x 8-10",t:25,u:"kg",tip:"Flat pin machine. Add 2.5-5 kg once all sets hit the top reps"},
  {n:"Lat Pulldown",s:"3 x 10-12",t:35,u:"kg",tip:"When all 3 sets hit the top reps, add 2.5-5 kg"},
  {n:"Assisted Dip",s:"3 x 8-10",t:30,u:"kg",lb:true,tip:"Log the assist kg. Drop 2.5-5 kg of assist when all sets hit the top reps"},
  {n:"Abcore Crunch",s:"2 x 12",t:10,u:"kg",tip:"Resistance holder only. +2 reps before adding weight"},
  {n:"Abcore Side",s:"2 x 10 / side",t:10,u:"kg",tip:"Red handle swivels the seat"},
  {n:"Shoulder Press",s:"3 x 10-12",t:5,u:"kg",tip:"Plate total. Do before incline. +1-2 reps a session"},
  {n:"Incline Press",s:"3 x 10-12",t:10,u:"kg",tip:"Clean reps first, then add 2.5 kg"},
  {n:"Bicep Curl",s:"2 x 12",t:17.5,u:"kg",tip:"Add 2.5 kg once both sets hit the top reps"}],
 "Lower A":[
  {n:"Bike warmup",s:"5 min",t:5,u:"min",tip:"Easy spin"},
  {n:"Hack Squat",s:"3 x 8-10",t:0,u:"kg",tip:"Log the plates you add in kg"},
  {n:"Leg Press",s:"3 x 10-12",t:80,u:"kg",tip:"Total plates. Add 5-10 kg once all sets hit the top reps"},
  {n:"Leg Extension",s:"2 x 12-15",t:17.5,u:"kg",tip:"New. Adjust after set 1"},
  {n:"Seated Leg Curl",s:"3 x 10-12",t:25,u:"kg",tip:"Add 2.5-5 kg when all sets hit the top reps"},
  {n:"Seated Calf Raise",s:"3 x 12-15",t:30,u:"kg",tip:"Pause at the bottom stretch. Add 5 kg when all sets hit the top reps"},
  {n:"Abductor",s:"2 x 15",t:22.5,u:"kg",tip:"New. Adjust after set 1"},
  {n:"Knee Raise",s:"2 x 10",t:0,u:"BW",tip:"Slow, no swinging. +2 reps next time"},
  {n:"Plank",s:"2 x 45 s",t:45,u:"sec",tip:"Add 5-10 seconds when both holds feel solid"}],
 "Upper B":[
  {n:"Bike warmup",s:"5 min",t:5,u:"min",tip:"Easy spin"},
  {n:"Assisted Pull-up",s:"3 x 6-10",t:35,u:"kg",lb:true,tip:"1st floor chin/dip combo. Log the assist kg. Drop 2.5-5 kg of assist when all sets hit the top reps"},
  {n:"Decline Press",s:"3 x 8-10",t:10,u:"kg",tip:"Iso-lateral, plate total. Adjust after set 1, add 2.5-5 kg when all sets hit the top reps"},
  {n:"Mid Row",s:"3 x 10-12",t:20,u:"kg",tip:"Pulldown combo, row station. Squeeze shoulder blades. Add 2.5-5 kg when all sets hit the top reps"},
  {n:"Reverse Fly",s:"2 x 12-15",t:10,u:"kg",tip:"Light, slow, rear shoulders. +2 reps before adding weight"},
  {n:"DB Lateral Raise",s:"3 x 12-15",t:8,u:"kg",tip:"Log both dumbbells together. Stop at shoulder height, no swinging"},
  {n:"DB Hammer Curl",s:"2 x 10-12",t:10,u:"kg",tip:"Log both dumbbells together. Add 1-2 kg per hand when both sets hit the top reps"},
  {n:"DB Overhead Triceps",s:"2 x 10-12",t:7.5,u:"kg",tip:"One dumbbell, both hands. Elbows in"},
  {n:"Dead Bug",s:"2 x 12",t:0,u:"BW",tip:"Lower back flat on the floor. +2 reps next time"}],
 "Lower B":[
  {n:"Bike warmup",s:"5 min",t:5,u:"min",tip:"Easy spin"},
  {n:"DB Glute Bridge",s:"3 x 12",t:10,u:"kg",tip:"Dumbbell on hips, pause 1 s at the top. Add 2.5-5 kg when all sets feel easy"},
  {n:"Leverage Squat",s:"3 x 8-10",t:0,u:"kg",tip:"Body-Solid lever. Start with the empty arm, add plates once form is solid"},
  {n:"Lying Leg Curl",s:"3 x 10-12",t:20,u:"kg",tip:"Slow lowering. Add 2.5-5 kg when all sets hit the top reps"},
  {n:"DB Walking Lunge",s:"2 x 10 / leg",t:10,u:"kg",tip:"Log both dumbbells together. Short controlled steps"},
  {n:"Rear Kick",s:"2 x 12 / leg",t:5,u:"kg",tip:"Glute kickback. Light, squeeze at the top"},
  {n:"Adductor",s:"2 x 15",t:20,u:"kg",tip:"Inner thigh. Adjust after set 1"},
  {n:"Standing Calf Raise",s:"3 x 12-15",t:0,u:"kg",tip:"Leverage machine. Full stretch at the bottom, pause at the top"},
  {n:"Hanging Leg Raise",s:"2 x 8-10",t:0,u:"BW",tip:"Straight legs. Finish with bent knees if needed. Pause at the bottom, no swing"}]
};

// ---------- Storage ----------
const KEY="liftlog.v1";
const PLAN0 = JSON.parse(JSON.stringify(PLAN));
function clone(x){return JSON.parse(JSON.stringify(x))}
const FEELS=['easy','good','hard'];
function freshDB(){return {ver:2,order:ORDER0.slice(),created:Date.now(),sets:[],body:[],runs:[],plan:clone(PLAN0),custom:[],notes:{},feel:{},fin:{},lastExportCount:0}}
// Old seed hints gave absolute targets. Swap them for the relative v15 wording.
const TIPFIX={"Flat pin machine. Up from 20":"Chest Press","Hit 3x12, then go 40":"Lat Pulldown","Assist kg. Less assist = harder":"Assisted Dip","Resistance holder only":"Abcore Crunch","Plate total. Do BEFORE incline":"Shoulder Press","Reset from 15, clean reps":"Incline Press","Up from 15":"Bicep Curl","Total plates. Hit 3x12, then 90":"Leg Press","Did 25 x12 x2 before":"Seated Leg Curl","Slow, no swinging":"Knee Raise","Reps box = seconds held":"Plank"};
// Exercises that only exist in imported history still need the right unit
const HIST_U={"Dead Bug":"BW"};
let EMPTY_START=false, CORRUPT=false, DB;
{const raw=localStorage.getItem(KEY); try{DB=raw==null?null:JSON.parse(raw)}catch(e){DB=undefined}
 // Unreadable data is stashed, never silently overwritten by Start fresh
 if(raw!=null&&(!DB||typeof DB!=='object'||Array.isArray(DB))){try{localStorage.setItem('liftlog.corrupt',raw)}catch(e){} CORRUPT=true; DB=null}}
if(!DB){DB=freshDB();EMPTY_START=true}
function allPlan(){return DB.plan||PLAN0}
function PLAN0Flat(){return Object.values(PLAN0).flat()}
function findPlan(ex){for(const a of Object.values(allPlan())){const p=Array.isArray(a)&&a.find(x=>x.n===ex);if(p)return p}return null}
// Ids end up in data-id attributes, so imported ids are reduced to safe characters
const safeId=x=>String(x??'').replace(/[^\w.:-]/g,'');
function migrate(d){
  d.ver=d.ver||1; d.sets=Array.isArray(d.sets)?d.sets:[]; d.body=Array.isArray(d.body)?d.body:[]; d.runs=Array.isArray(d.runs)?d.runs:[];
  d.order=Array.isArray(d.order)?[...new Set(d.order.filter(o=>typeof o==='string').map(o=>o.trim().replace(/\s+/g,' ').slice(0,24)).filter(Boolean))].slice(0,8):[]; if(!d.order.length)d.order=ORDER0.slice();
  {const P=d.plan&&typeof d.plan==='object'&&!Array.isArray(d.plan)?d.plan:clone(PLAN0); d.plan={}; d.order.forEach(o=>{d.plan[o]=Array.isArray(P[o])?P[o].filter(x=>x&&typeof x==='object'&&typeof x.n==='string'&&x.n.trim()).map(x=>({...x,n:x.n.trim(),s:String(x.s??''),tip:String(x.tip??''),t:Number.isFinite(+x.t)?+x.t:0})):[]})}
  d.custom=Array.isArray(d.custom)?d.custom:[]; d.units=d.units&&typeof d.units==='object'&&!Array.isArray(d.units)?d.units:{};
  // The sled unit was dropped in v14; every loaded movement is plain kg now
  Object.values(d.plan).forEach(a=>Array.isArray(a)&&a.forEach(p=>{if(p.u==='sled'){p.u='kg';p.t=p.t||0;if(/sled/i.test(p.tip||''))p.tip='Log the plates you add in kg'}}));
  // v15: assist became plain kg with a less-is-stronger flag, and absolute tips became relative
